<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Engineering | Cyber Defenders</title>
<style>
body{background:#11111b;color:#cdd6f4;font-family:Arial,sans-serif;margin:0;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;border-bottom:2px solid #00ff88;padding-bottom:15px}
h1,h2{color:#00ff88;margin:0}
#player-info{font-size:18px;font-weight:bold;color:#00ff88}
button{padding:12px 18px;border:none;border-radius:6px;background:#00ff88;color:#11111b;font-weight:bold;cursor:pointer;font-size:15px}
button:hover:not(:disabled){background:#8cffc8}
button:disabled{opacity:.5;cursor:default}
.back,.ghost{background:transparent;border:1px solid #45475a;color:#cdd6f4}
.back:hover:not(:disabled),.ghost:hover:not(:disabled){background:#313244}
#mascot-box{display:flex;align-items:center;background:#1e1e2e;border:1px solid #00ff88;padding:15px;border-radius:10px;max-width:650px;margin:25px auto 0}
.panel{max-width:650px;margin:20px auto;padding:25px;background:#1e1e2e;border:1px solid #45475a;border-radius:12px}
.card-mode{display:block;width:100%;text-align:left;background:#11111b;border:2px solid #45475a;border-radius:12px;padding:16px;margin:10px 0;color:#cdd6f4;font-weight:normal;transition:all .3s ease}
.card-mode:hover{border-color:#00ff88;color:#00ff88;transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,255,136,.35);background:#11111b}
#log{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px;margin:10px 0}
.m{max-width:85%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.bot{background:#313244;align-self:flex-start;border-bottom-left-radius:4px}
.me{background:#00ff88;color:#11111b;align-self:flex-end;border-bottom-right-radius:4px}
.sys{align-self:center;font-size:13px;color:#a6adc8}
.row{display:flex;gap:8px;margin-top:8px}
input{flex:1;min-width:0;box-sizing:border-box;padding:12px;border-radius:6px;border:1px solid #45475a;background:#11111b;color:#cdd6f4;font-size:16px}
.timer{height:6px;background:#313244;border-radius:4px;overflow:hidden}
.timer div{height:100%;width:100%;background:#00ff88;transition:width 1s linear}
.hint{color:#a6adc8;font-size:14px}
.res{border-left:4px solid #00ff88;padding:8px 12px;background:#11111b;border-radius:6px;margin-bottom:12px}
.res.bad{border-color:#f38ba8}
</style>
</head>
<body>
<header>
  <h1>💬 Social Engineering</h1>
  <div id="player-info"><span id="display-name">Jucător: Anonim</span> | <span id="display-score">Scor: 0</span> | <span id="display-lives">❤️❤️❤️</span></div>
  <button class="back" onclick="window.location.href='index.html'">⬅ Înapoi la Meniu</button>
</header>

<div id="mascot-box">
  <div style="font-size:40px;margin-right:15px">🤖</div>
  <div><strong style="color:#00ff88">Cyberbot:</strong>
  <p id="mascot-text" style="margin:5px 0 0 0"></p></div>
</div>

<main class="panel" id="stage"></main>

<script src="player.js"></script>
<script>
// ====== SETARE: URL-ul Cloudflare Worker-ului tău (vezi worker.js) ======
const WORKER_URL = "https://cyber-defenders-se.anda24931.workers.dev";

const SCENARIOS = [
  {id:"it",icon:"🧑‍💻",title:"Suport IT „prietenos”",lvl:1,who:"Radu (Suport IT)",open:"Salut! Sunt Radu de la Suportul IT. Am văzut o autentificare ciudată pe contul tău de student. Ai primit cumva un mesaj de la noi azi?"},
  {id:"friend",icon:"👤",title:"Colegul cu număr nou",lvl:2,who:"Mihai (număr nou)",open:"Heii, sunt Mihai! Mi-am pierdut telefonul și scriu de pe numărul unui prieten 😅 ești pe aici?"},
  {id:"intern",icon:"💼",title:"Recrutorul „perfect”",lvl:3,who:"Elena (recrutor TechNova)",open:"Bună! Sunt Elena de la TechNova. Profilul tău ne-a impresionat și avem un internship plătit, remote, pentru studenți la informatică. Ești interesată/interesat?"}
];
const TIME_LIMIT = 45, MAX_TURNS = 8;

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
let lives = 3, R = null, timer = null;

// ----- integrare cu restul jocului (nume + scor comune prin localStorage) -----

function getScore(){ return Number(localStorage.getItem("cd-score")) || 0; }
function addScore(d){ localStorage.setItem("cd-score", Math.max(0, getScore() + d)); showHud(); }
function showHud(){ $("#display-score").textContent = "Scor: " + getScore(); $("#display-lives").textContent = "❤️".repeat(Math.max(lives, 0)) || "💔"; }
function say(t){ $("#mascot-text").textContent = t; }

function menu(){
  clearInterval(timer);
  if (lives <= 0) lives = 3;
  showHud();
  say("Un atacator te abordează pe chat și nu are un script: se adaptează la ce spui. Ai " + TIME_LIMIT + " de secunde pentru fiecare răspuns. Alege o misiune!");
  const st = $("#stage");
  st.replaceChildren(el("h2", "", "🛡️ Misiuni de chat și manipulare"));
  SCENARIOS.forEach(sc => {
    const b = el("button", "card-mode", sc.icon + " " + sc.title + " · dificultate " + "★".repeat(sc.lvl));
    b.onclick = () => start(sc);
    st.append(b);
  });
  st.append(el("p", "hint", "Toate datele sunt fictive. Nu scrie niciodată parole, CNP sau date de card reale."));
}

function start(sc){
  if (WORKER_URL.includes("NUMELE-TAU")) { alert("Setează WORKER_URL în social-engineering.html (vezi worker.js)."); return; }
  R = {sc, hist:[{r:"A", t:sc.open}], turn:0, tactics:[], tips:[], busy:false};
  say("Atenție: cineva îți scrie. Nu te grăbi, dar nici nu tăcea prea mult!");
  const st = $("#stage");
  const tm = el("div", "timer"), fill = el("div"); tm.append(fill);
  const log = el("div"); log.id = "log";
  const input = el("input"); input.placeholder = "Scrie răspunsul…"; input.maxLength = 500; input.autocomplete = "off";
  const send = el("button", "", "Trimite");
  const rep = el("button", "ghost", "🚩 Blochează și raportează");
  rep.style.marginTop = "8px";
  const row = el("div", "row"); row.append(input, send);
  st.replaceChildren(el("div", "hint", sc.icon + " " + sc.who), tm, log, row, rep);
  R.ui = {fill, log, input, send, rep};
  addMsg("bot", sc.open);
  send.onclick = () => submit(input.value);
  input.onkeydown = e => { if (e.key === "Enter") submit(input.value); };
  rep.onclick = () => submit("Te blochez și raportez conversația. Verific pe canalele oficiale.");
  input.focus(); runTimer();
}

function addMsg(cls, text){ const d = el("div", "m " + cls, text); R.ui.log.append(d); R.ui.log.scrollTop = R.ui.log.scrollHeight; return d; }
function lock(v){ R.ui.send.disabled = R.ui.rep.disabled = R.ui.input.disabled = v; }
function runTimer(){
  clearInterval(timer); let t = TIME_LIMIT; R.ui.fill.style.width = "100%";
  timer = setInterval(() => { t--; R.ui.fill.style.width = (t / TIME_LIMIT * 100) + "%"; if (t <= 0) { clearInterval(timer); submit("", true); } }, 1000);
}

async function submit(text, silent){
  text = (text || "").trim();
  if (R.busy || (!text && !silent)) return;
  R.busy = true; clearInterval(timer); R.ui.input.value = ""; lock(true);
  if (silent) { addMsg("sys", "⏱ Nu ai răspuns la timp…"); R.hist.push({r:"P", t:"(nu a răspuns în " + TIME_LIMIT + " secunde)"}); }
  else { addMsg("me", text); R.hist.push({r:"P", t:text}); }
  R.turn++;
  const typing = addMsg("bot", "…");
  try {
    const resp = await fetch(WORKER_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({scenarioId:R.sc.id, history:R.hist})});
    if (!resp.ok) throw new Error("http " + resp.status);
    const j = await resp.json();
    typing.textContent = j.reply || "…";
    R.hist.push({r:"A", t:j.reply || ""});
    if (j.tactic) R.tactics.push(j.tactic);
    if (j.tip && !silent) R.tips.push(j.tip);
    if (j.status === "leaked") return finish(false);
    if (j.status === "defended") return finish(true);
    if (R.turn >= MAX_TURNS) return finish(true, true);
    if (!silent) addScore(5);
    R.busy = false; lock(false); R.ui.input.focus(); runTimer();
  } catch (e) {
    typing.textContent = "⚠️ Conexiunea cu atacatorul a eșuat. Încearcă din nou.";
    R.hist.pop(); R.turn--; R.busy = false; lock(false);
  }
}

function finish(win, survived){
  clearInterval(timer);
  if (win) { addScore(survived ? 20 : 30); say("Bravo! Ai rezistat. Citește ce tactici au fost folosite împotriva ta."); }
  else { lives--; showHud(); say("Au! Ai cedat. Nu-i nimic: acum știi cum arată tactica."); }
  const st = $("#stage");
  st.replaceChildren();
  const r = el("div", "res" + (win ? "" : " bad"), win ? (survived ? "🛡️ Ai rezistat tot timpul! +20" : "🛡️ Atac respins! +30") : "⚠️ Ai cedat. −1 viață");
  st.append(r);
  const list = (title, items) => { st.append(el("p", "", title)); const ul = el("ul"); items.forEach(t => ul.append(el("li", "", t))); st.append(ul); };
  list("Tactici folosite împotriva ta:", [...new Set(R.tactics)]);
  list("Sfaturi:", R.tips.slice(-3));
  const b = el("button", "", lives <= 0 ? "Joc terminat · reia" : "Alege alt scenariu");
  b.onclick = menu; st.append(b);
}
menu();
</script>
</body>
</html>
