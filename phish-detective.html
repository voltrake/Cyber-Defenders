<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Defenders - Ultimate Edition</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #11111b;
            border-bottom: 2px solid #00ff88;
        }

        #player-info {
            font-size: 16px;
            font-weight: bold;
            color: #00ff88;
        }

        .rank-badge {
            background: #313244;
            color: #f9e2af;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-left: 5px;
        }

        .modes-grid {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .card-mode {
            flex: 1;
            background-color: #1e1e2e;
            border: 2px solid #45475a;
            border-radius: 12px;
            padding: 25px;
            color: #cdd6f4;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card-mode:hover {
            border-color: #00ff88;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 255, 136, 0.4);
            color: #00ff88;
        }

        /* Harta niveluri */
        #levels-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            max-width: 650px;
            margin: 20px auto 0 auto;
            padding: 10px;
        }

        .level-btn {
            height: 70px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .level-btn.unlocked {
            background: #00ff88;
            color: #11111b;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .level-btn.unlocked:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(0, 255, 136, 0.6);
        }

        .level-btn.locked {
            background: #313244;
            color: #a6adc8;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .stars-container {
            font-size: 11px;
            letter-spacing: 1px;
        }

        #game-screen {
            display: none;
            max-width: 650px;
            margin: 20px auto;
            background: #1e1e2e;
            border: 2px solid #45475a;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .simulator-email {
            background: #181825 !important;
            border-color: #89b4fa !important;
        }
        .simulator-sms {
            background: #11111b !important;
            border-color: #a6e3a1 !important;
            border-radius: 25px !important;
        }

        .chat-bubble {
            background: #313244;
            border-radius: 15px 15px 15px 0px;
            padding: 12px 16px;
            margin-top: 10px;
            color: #cdd6f4;
            line-height: 1.4;
        }
        #timer-box {
            width: 100%;
            background: #313244;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background: #00ff88;
            transition: width 1s linear, background-color 0.3s;
        }
        .correct-flash {
            animation: flashGreen 0.5s ease;
        }

        .wrong-shake {
            animation: shakeRed 0.5s ease;
        }

        @keyframes flashGreen {
            0% { box-shadow: 0 0 0px #00ff88; }
            50% { box-shadow: 0 0 35px #00ff88; border-color: #00ff88; }
            100% { box-shadow: 0 0 0px #00ff88; }
        }

        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); border-color: #f38ba8; box-shadow: 0 0 25px #f38ba8; }
            40%, 80% { transform: translateX(10px); border-color: #f38ba8; box-shadow: 0 0 25px #f38ba8; }
        }
        #cyberbot-companion {
            position: fixed;
            bottom: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 1000;
        }

        .speech-bubble {
            background: #1e1e2e;
            border: 2px solid #00ff88;
            color: #cdd6f4;
            padding: 10px 14px;
            border-radius: 15px 15px 0px 15px;
            max-width: 250px;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
            margin-bottom: 8px;
            font-size: 13px;
        }

        .robot-avatar img {
            width: 110px;
            height: auto;
            border-radius: 50%;
        }

        .clue-highlight {
            background-color: rgba(249, 226, 175, 0.3);
            border-bottom: 2px dashed #f9e2af;
            color: #f9e2af;
            padding: 2px 4px;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .modes-grid { flex-direction: column !important; }
            #levels-grid { grid-template-columns: repeat(3, 1fr) !important; }
            
            #cyberbot-companion {
                left: 10px !important;
                right: 10px !important;
                bottom: 10px !important;
                flex-direction: row !important;
                align-items: flex-end !important;
                justify-content: flex-end !important;
                pointer-events: none !important;
            }

            .speech-bubble {
                max-width: 65% !important;
                font-size: 11px !important;
                margin-right: 8px !important;
                margin-bottom: 5px !important;
                pointer-events: auto !important;
            }

            .robot-avatar img {
                width: 70px !important;
                pointer-events: auto !important;
            }

            main#app-container { padding-bottom: 110px !important; }
        }
    </style>
</head>
<body>

        <div class="robot-avatar" id="bot-avatar">

    <script>
        // Web Audio API Synth pentru efecte sonore vintage/cyber
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'correct') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch(e){}
        }

        const levelSelect = document.querySelector("#level-select");
        const adventureTitle = document.querySelector("#adventure-title");
        const btnBackMenu = document.querySelector("#btn-back-menu");
        const cyberbotCompanion = document.querySelector("#cyberbot-companion");

        const levelsGrid = document.querySelector("#levels-grid");

        let scor = 0;

        let timerInterval;

        const gameScreen = document.querySelector("#game-screen");
        const mailSender = document.querySelector("#mail-sender");
        const mailSubject = document.querySelector("#mail-subject");

        const btnLegit = document.querySelector("#btn-legit");

        const actionButtons = document.querySelector("#action-buttons");
        const btnNext = document.querySelector("#btn-next");
        const btnToMap = document.querySelector("#btn-to-map");
        const displayScore = document.querySelector("#display-score");
        const displayRank = document.querySelector("#display-rank");

            { id: 3, tip: "email", expeditor: "suport-clienti@banca-transi1vania.ro", subiect: "Actualizare date bancare obligatorie", corp: "Conform noilor reglementări, trebuie să introduci codul PIN pe linkul atașat pentru validare.", estePhishing: true, indiciu: "banca-transi1vania.ro", explicatie: "Băncile nu îți vor cere NICIODATĂ codul PIN sau date confidențiale prin e-mail!" },
            { id: 4, tip: "email", expeditor: "noreply@google.com", subiect: "Alerte de securitate: Conectare nouă pe Linux", corp: "Un dispozitiv nou s-a conectat la contul tău. Dacă ai fost tu, poți ignora acest mesaj.", estePhishing: false, indiciu: "google.com", explicatie: "Este o notificare oficială de securitate de la Google, fără link-uri dubioase." },
            { id: 5, tip: "email", expeditor: "castigator@loteria-romana-premiu.click", subiect: "FELICITĂRI! Ai câștigat 50.000 EURO!", corp: "Ai fost extras câștigător. Pentru a primi banii, plătește o taxă de procesare de 100 RON.", estePhishing: true, indiciu: "premiu.click", explicatie: "Dacă nu ai participat la nicio loterie, cererea de bani în avans este un semn clar de fraudă." },
            { id: 6, tip: "email", expeditor: "contact@netflix.com", subiect: "Chitanță pentru abonamentul tău lunar", corp: "Plata pentru abonamentul tău Netflix a fost procesată cu succes. Îți mulțumim!", estePhishing: false, indiciu: "netflix.com", explicatie: "Factură legitimă de la domeniul oficial netflix.com." },
            { id: 7, tip: "sms", expeditor: "+40 721 000 111", subiect: "SMS - Curierat", corp: "FanCourier: Pachetul tău e blocat în depozit din cauza adresei incomplete. Actualizează adresa aici: bit.ly/3x9L-fancourier", estePhishing: true, indiciu: "bit.ly/3x9L-fancourier", explicatie: "Firmele de curierat nu folosesc link-uri scurtate (bit.ly) pentru a-ți cere date sau plăți." },
            { id: 8, tip: "sms", expeditor: "Banca BCR", subiect: "SMS - Alertă Card", corp: "Cardul tău a fost temporar restricționat. Intră pe bcr-securitate-online.com pentru deblocare.", estePhishing: true, indiciu: "bcr-securitate-online.com", explicatie: "Numele afișat poate fi falsificat (SMS Spoofing). Domeniul 'bcr-securitate-online.com' este neoficial." },
            { id: 9, tip: "sms", expeditor: "BT", subiect: "SMS - Notificare", corp: "A fost efectuată o plată de 45.00 LEI la Mega Image. Sold disponibil: 320.50 LEI.", estePhishing: false, indiciu: "Informație legitimă", explicatie: "SMS informativ legitim de la bancă, fără link-uri sau cereri urgente." },
            { id: 10, tip: "sms", expeditor: "+40 732 999 888", subiect: "SMS - WhatsApp", corp: "Codul tău de verificare WhatsApp este 482-193. Nu distribui acest cod nimănui!", estePhishing: false, indiciu: "Autentificare 2FA", explicatie: "Mesaj automat autentic pentru autentificare în doi pași (2FA)." },
            { id: 11, tip: "sms", expeditor: "+40 755 123 456", subiect: "SMS - Fibră Optică", corp: "DIGI: Factura ta în valoare de 55 lei a fost emisă. Detalii în contul MyDIGI sau pe digi.ro.", estePhishing: false, indiciu: "digi.ro", explicatie: "Notificare legitimă cu direcționare către site-ul oficial digi.ro." },
            { id: 12, tip: "sms", expeditor: "+40 711 222 333", subiect: "SMS - Fiul/Fiica", corp: "Mama, mi-am pierdut telefonul și acesta este noul meu număr. Trimite-mi 200 lei prin Revolut pe numărul ăsta urgent!", estePhishing: true, indiciu: "Trimite-mi 200 lei", explicatie: "Clasica fraudă 'Ruda la ananghie'. Verifică mereu sunând pe numărul vechi al persoanei!" },
            { id: 13, tip: "sms", expeditor: "ANAF-Alert", subiect: "SMS - Executare Silită", corp: "ANAF: Aveți o restanță fiscală de 340 RON. Evitați poprirea conturilor achitând rapid la: anaf-ghiseul-online.net", estePhishing: true, indiciu: "anaf-ghiseul-online.net", explicatie: "ANAF nu trimite somații de plată urgente prin SMS cu link-uri către domenii neoficiale." },
            { id: 14, tip: "email", expeditor: "ceo-director@company-internal-desk.com", subiect: "CONFIDENȚIAL: Transfer bancar urgent", corp: "Sunt într-o ședință importantă. Am nevoie să efectuezi de urgență un transfer de 2000 EUR către acest furnizor. Nu vorbi cu nimeni altcineva.", estePhishing: true, indiciu: "company-internal-desk.com", explicatie: "Atac de tip 'CEO Fraud'. Atacatorii creează urgență și cer secretomanie." },
            { id: 15, tip: "email", expeditor: "admin@discord-verify.gg", subiect: "Contul tău Discord necesită re-verificare", corp: "Pentru a-ți păstra statusul de membru și serverele, scanează codul QR sau autentifică-te pe linkul anexat.", estePhishing: true, indiciu: "discord-verify.gg", explicatie: "Domeniul 'discord-verify.gg' este fals. Furt de sesiuni/token-uri de Discord." },
            { id: 16, tip: "email", expeditor: "steam-support@steampowered.com", subiect: "Anulare tranzacție Piața Community", corp: "Tranzacția ta pentru item-ul 'CS:GO Skin' a fost finalizată. Poți vedea istoricul în aplicație.", estePhishing: false, indiciu: "steampowered.com", explicatie: "E-mail legitim de la domeniul oficial steampowered.com." },
            { id: 17, tip: "email", expeditor: "hr-department@firme-romania-hr.ro", subiect: "Fișiere marire de salariu Q4.exe", corp: "Găsești în atașament noua grilă de salarizare valabilă din această lună. Deschide fișierul pentru detalii.", estePhishing: true, indiciu: "Q4.exe", explicatie: "Un fișier executabil (.exe) primit prin e-mail este aproape întotdeauna un virus/malware!" },
            { id: 18, tip: "sms", expeditor: "+40 799 000 111", subiect: "SMS - OLX", corp: "Un cumpărător a plătit produsul tău pe OLX! Introdu datele cardului pentru a primi banii: olx-primeste-banii.ro/pay", estePhishing: true, indiciu: "olx-primeste-banii.ro", explicatie: "Banii se primesc în cont pe baza codului IBAN, niciodată introducând datele cardului!" },
            { id: 19, tip: "email", expeditor: "security@instagram.com", subiect: "Un nou dispozitiv conectat", corp: "Contul tău a fost accesat din București, România. Dacă ai fost tu, nu trebuie să faci nimic.", estePhishing: false, indiciu: "instagram.com", explicatie: "E-mail oficial de la Instagram/Meta." },
            { id: 20, tip: "email", expeditor: "it-helpdesk@firma-ta.ro", subiect: "Misiune Finală: Resetare Parolă Generală", corp: "Echipa IT efectuează mentenanță. Te rugăm să introduci parola actuală pe serverul temporar: temp-it-portal.com", estePhishing: true, indiciu: "temp-it-portal.com", explicatie: "Departamentul IT nu îți va cere niciodată parola curentă pe un site extern neoficial!" }

        function actualizeazaRang() {
            if (scor >= 1500) displayRank.textContent = "🏆 Master Detective";
            else if (scor >= 700) displayRank.textContent = "🕵️‍♂️ Analist Phishing";
            else displayRank.textContent = "🌱 Novice";
        }

        function genereazaHartaNiveluri() {
            levelsGrid.innerHTML = ""; 
            niveluriPhishing.forEach((nivel, index) => {
                const btn = document.createElement("button");
                btn.className = `level-btn ${index <= nivelMaximDeblocat ? 'unlocked' : 'locked'}`;
                
                let starsHTML = "";
                const nrStele = starScores[index] || 0;
                for (let i = 0; i < 3; i++) {
                    starsHTML += i < nrStele ? "⭐" : "☆";
                }

                if (index <= nivelMaximDeblocat) {
                    btn.innerHTML = `<span>Nivel ${nivel.id}</span><span class="stars-container">${starsHTML}</span>`;
                    btn.addEventListener("click", () => incarcaNivel(index));
                } else {
                    btn.innerHTML = `<span>🔒 ${nivel.id}</span>`;
                }

                levelsGrid.appendChild(btn);
            });
        }

        btnBackMenu.addEventListener("click", function() {
            clearInterval(timerInterval);
            window.location.href = "index.html";
        });

        function pornesteTimer() {
            clearInterval(timerInterval);
            timpRamas = 30;
            timerBar.style.width = "100%";
            timerBar.style.backgroundColor = "#00ff88";

            timerInterval = setInterval(() => {
                timpRamas--;
                const procent = (timpRamas / 30) * 100;
                timerBar.style.width = procent + "%";

                if (timpRamas <= 10) timerBar.style.backgroundColor = "#f38ba8";

                if (timpRamas <= 0) {
                    clearInterval(timerInterval);
                    verificaRaspuns(null); // Timpul a expirat!
                }
            }, 1000);
        }

        function incarcaNivel(index) {
            nivelCurent = index;
            const dateNivel = niveluriPhishing[index];

            gameScreen.classList.remove("correct-flash", "wrong-shake");

            // Schimbare tema Vizuală Email vs SMS
            if (dateNivel.tip === "sms") {
                gameScreen.className = "simulator-sms";
                msgTypeTag.textContent = "💬 MESAJE SMS";
                msgTypeTag.style.background = "#a6e3a1";
                msgTypeTag.style.color = "#11111b";
                subjectLine.style.display = "none";
            } else {
                gameScreen.className = "simulator-email";
                msgTypeTag.textContent = "📧 E-MAIL RECEIVD";
                msgTypeTag.style.background = "#89b4fa";
                msgTypeTag.style.color = "#11111b";
                subjectLine.style.display = "block";
            }

            actionButtons.style.display = "none";
            decisionButtons.style.display = "flex";

            levelSelect.style.display = "none";
            gameScreen.style.display = "block";

            mailSender.textContent = dateNivel.expeditor;
            mailSubject.textContent = dateNivel.subiect;
            emailBody.innerHTML = dateNivel.corp;

            botBubble.textContent = `Nivelul ${dateNivel.id}: Analizează cu atenție mesajul! Răspunde înainte să expire timpul!`;

            pornesteTimer();
        }

        // Lupa de Detectiv (Highlight Indiciu)
        btnInspect.addEventListener("click", function() {
            const dateNivel = niveluriPhishing[nivelCurent];
            if (dateNivel.indiciu) {
                let html = emailBody.innerHTML;
                if (!html.includes("clue-highlight")) {
                    html = html.replace(dateNivel.indiciu, `<span class="clue-highlight">${dateNivel.indiciu}</span>`);
                    emailBody.innerHTML = html;
                }
                botBubble.textContent = `🔍 Indiciu: Uită-te atent la textul evidențiat!`;
            }
        });

        function verificaRaspuns(alegereLegitim) {
            clearInterval(timerInterval);
            const dateNivel = niveluriPhishing[nivelCurent];
            const esteCorect = (alegereLegitim !== null) && (alegereLegitim === !dateNivel.estePhishing);

            gameScreen.classList.remove("correct-flash", "wrong-shake");
            void gameScreen.offsetWidth; // Trigger reflow animation

            if (esteCorect) {
                playSound('correct');
                gameScreen.classList.add("correct-flash");

                // Calcul Stele în funcție de timp
                let stele = 1;
                if (timpRamas > 15) stele = 3;
                else if (timpRamas > 5) stele = 2;

                const puncteCastigate = stele * 50;
                scor += puncteCastigate;
                starScores[nivelCurent] = Math.max(starScores[nivelCurent], stele);

                displayScore.textContent = "Scor: " + scor;
                actualizeazaRang();

                botBubble.textContent = `🎯 Corect! (${stele} ⭐, +${puncteCastigate}p) ${dateNivel.explicatie}`;

                if (nivelCurent + 1 > nivelMaximDeblocat && nivelCurent + 1 < niveluriPhishing.length) {
                    nivelMaximDeblocat = nivelCurent + 1;
                }
            } else {
                playSound('wrong');
                gameScreen.classList.add("wrong-shake");
                botBubble.textContent = alegereLegitim === null ? 
                    `⏰ Timpul a expirat! ${dateNivel.explicatie}` : 
                    `❌ Greșit! ${dateNivel.explicatie}`;
            }

            decisionButtons.style.display = "none";
            actionButtons.style.display = "flex";
        }

        btnLegit.addEventListener("click", () => verificaRaspuns(true));
        btnPhish.addEventListener("click", () => verificaRaspuns(false));

        btnNext.addEventListener("click", function() {
            if (nivelCurent + 1 < niveluriPhishing.length) {
                incarcaNivel(nivelCurent + 1);
            } else {
                gameScreen.style.display = "none";
                genereazaHartaNiveluri();
                levelSelect.style.display = "block";
                botBubble.textContent = `🏆 FELICITĂRI! Ai completat toate cele 20 de niveluri! Scor final: ${scor} puncte!`;
            }
        });

        btnToMap.addEventListener("click", function() {
            gameScreen.style.display = "none";
            genereazaHartaNiveluri(); 
            levelSelect.style.display = "block";
            botBubble.textContent = "Alege următorul nivel de pe hartă pentru a continua!";
        });

        genereazaHartaNiveluri();
        cyberbotCompanion.style.display = "flex";
        botBubble.textContent = "Salut! Sunt CyberBot. Alege un nivel deblocat! 🕵️‍♂️";
    </script>
</body>
</html>
