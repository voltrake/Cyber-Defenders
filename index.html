<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield Academy</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #11111b;
            border-bottom: 2px solid #00ff88;
        }

        #player-info {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        .modes-grid {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card-mode {
            flex: 1;
            background-color: #1e1e2e;
            border: 2px solid #45475a;
            border-radius: 12px;
            padding: 25px;
            color: #cdd6f4;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Corectat: fără spațiu înainte de :hover */
        .card-mode:hover {
            border-color: #00ff88;
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.5);
            color: #00ff88;
        }
    </style>
</head>
<body>
    <!-- 1. Header (Bara de sus) -->
    <header>
        <h1>🛡️ Cyber Defenders</h1>
        <div id="player-info">
            <span id="display-name">Jucător: Anonim</span> | 
            <span id="display-score">Scor: 0</span>
        </div>
    </header>

    <!-- 2. Main Content Container -->
    <main id="app-container" style="padding: 20px;">
        
        <!-- Mascota CyberBot -->
        <div id="mascot-box" style="display: flex; align-items: center; background: #1e1e2e; border: 1px solid #00ff88; padding: 15px; border-radius: 10px; margin-bottom: 25px;">
            <div style="font-size: 40px; margin-right: 15px;">🤖</div>
            <div>
                <strong style="color:#00ff88;">Cyberbot:</strong>
                <p id="mascot-text" style="margin: 5px 0 0 0; color: #cdd6f4;">Salut! Alege o aventură pentru a începe aventura ta în lumea securității cibernetice.</p>
            </div>
        </div>

        <h2 id="section-title">Alege o aventură:</h2>

        <!-- MENIUL PRINCIPAL (Doar cele 3 carduri noi) -->
        <div class="modes-grid">
            <button id="btn-phishing" class="card-mode">
                <h3>🎣 Phish Detective</h3>
                <p>Niveluri: E-mailuri și SMS-uri suspecte</p>
            </button>
            <button id="btn-password" class="card-mode">
                <h3>🔑 Password Shield</h3>
                <p>Niveluri: Spargere și fortificare parole</p>
            </button>
            <button id="btn-social" class="card-mode">
                <h3>💬 Social Engineering</h3>
                <p>Niveluri: Misiuni de chat & manipulare</p>
            </button>
            <button id="btn-social" class="card-mode">
                <h3>Fake files and suspicious archives</h3>
                <p>Niveluri:  Recunoașterea fișierelor periculoase</p>
            </button>
        </div>

    </main>

    <script src="player.js"></script>

    <!-- 3. Logică JavaScript -->
    <script>
        // Click pe Phish Detective
        document.querySelector("#btn-phishing").addEventListener("click", function() {
            window.location.href = "phish-detective.html";
        });

        // Click pe Password Shield
        document.querySelector("#btn-password").addEventListener("click", function() {
            window.location.href = "password-shield.html";
        });
        
    </script>
</body>
</html>
