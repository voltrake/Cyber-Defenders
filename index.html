<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield Academy</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #11111b;
            border-bottom: 2px solid #00ff88;
        }

        #player-info {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        .modes-grid {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card-mode {
            flex: 1;
            background-color: #1e1e2e;
            border: 2px solid #45475a;
            border-radius: 12px;
            padding: 25px;
            color: #cdd6f4;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Corectat: fără spațiu înainte de :hover */
        .card-mode:hover {
            border-color: #00ff88;
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.5);
            color: #00ff88;
        }
    </style>
</head>
<body>
    <!-- 1. Header (Bara de sus) -->
    <header>
        <h1>🛡️ Cyber Defenders</h1>
        <div id="player-info">
            <span id="display-name">Jucător: Anonim</span> | 
            <span id="display-score">Scor: 0</span>
        </div>
    </header>

    <!-- 2. Main Content Container -->
    <main id="app-container" style="padding: 20px;">
        
        <!-- Mascota CyberBot -->
        <div id="mascot-box" style="display: flex; align-items: center; background: #1e1e2e; border: 1px solid #00ff88; padding: 15px; border-radius: 10px; margin-bottom: 25px;">
            <div style="font-size: 40px; margin-right: 15px;">🤖</div>
            <div>
                <strong style="color:#00ff88;">Cyberbot:</strong>
                <p id="mascot-text" style="margin: 5px 0 0 0; color: #cdd6f4;">Salut! Alege o aventură pentru a începe aventura ta în lumea securității cibernetice.</p>
            </div>
        </div>

        <h2 id="section-title">Alege o aventură:</h2>

        <!-- MENIUL PRINCIPAL (Doar cele 3 carduri noi) -->
        <div class="modes-grid">
            <button id="btn-phishing" class="card-mode">
                <h3>🎣 Phish Detective</h3>
                <p>Niveluri: E-mailuri și SMS-uri suspecte</p>
            </button>
            <button id="btn-password" class="card-mode">
                <h3>🔑 Password Shield</h3>
                <p>Niveluri: Spargere și fortificare parole</p>
            </button>
            <button id="btn-social" class="card-mode">
                <h3>💬 Social Engineering</h3>
                <p>Niveluri: Misiuni de chat & manipulare</p>
            </button>
        </div>

        <!-- HARTA CU NIVELURI (Corectat id="level-select" și ascuns inițial) -->
        <div id="level-select" style="display: none; text-align: center; margin-top: 20px;">
            <button id="btn-back-menu" style="background: transparent; border: 1px solid #45475a; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; float: left;">⬅ Înapoi la Meniu</button>
            
            <h2 id="adventure-title" style="clear: both; padding-top: 10px; color: #00ff88;">Selectează un nivel</h2>
            
            <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px;">
                <button class="level-btn unlocked" id="lvl-1" style="width: 80px; height: 80px; background: #00ff88; color: #11111b; font-size: 24px; font-weight: bold; border: none; border-radius: 15px; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4);">
                    1 ⭐
                </button>
                <button class="level-btn locked" style="width: 80px; height: 80px; background: #313244; color: #a6adc8; font-size: 24px; border: none; border-radius: 15px; cursor: not-allowed; opacity: 0.6;">
                    🔒 2
                </button>
                <button class="level-btn locked" style="width: 80px; height: 80px; background: #313244; color: #a6adc8; font-size: 24px; border: none; border-radius: 15px; cursor: not-allowed; opacity: 0.6;">
                    🔒 3
                </button>
            </div>
        </div>

    </main>

    <!-- 3. Logică JavaScript -->
    <script>
        let nume = prompt("Introdu numele tău de detectiv:");
        let elementNume = document.querySelector("#display-name");
        if (nume) {
            elementNume.textContent = "Jucător: " + nume;
        }

        const modesGrid = document.querySelector(".modes-grid");
        const levelSelect = document.querySelector("#level-select");
        const mascotText = document.querySelector("#mascot-text");
        const adventureTitle = document.querySelector("#adventure-title");
        const sectionTitle = document.querySelector("#section-title");
        const btnBackMenu = document.querySelector("#btn-back-menu");

        // Click pe Phish Detective
        document.querySelector("#btn-phishing").addEventListener("click", function() {
            modesGrid.style.display = "none";
            sectionTitle.style.display = "none";
            levelSelect.style.display = "block";
            adventureTitle.textContent = "🎣 Phish Detective - Selectează Nivelul";
            mascotText.textContent = "Grozav! Ai ales Phish Detective. Completează Nivelul 1 pentru a debloca Nivelul 2!";
        });

        // Click pe Înapoi la Meniu
        btnBackMenu.addEventListener("click", function() {
            levelSelect.style.display = "none";
            modesGrid.style.display = "flex";
            sectionTitle.style.display = "block";
            mascotText.textContent = "M-am întors în meniu! Ce aventură vrei să încerci?";
        });

        // Click pe Password Shield
document.querySelector("#btn-password").addEventListener("click", function() {
    window.location.href = "password-shield.html";
});
        
    </script>
</body>
</html>
