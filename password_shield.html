<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Shield | Cyber Defenders</title>

    <style>
        body {
            background: #11111b;
            color: #cdd6f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #00ff88;
            padding-bottom: 15px;
        }

        h1, h2 {
            color: #00ff88;
        }

        .panel {
            max-width: 650px;
            margin: 40px auto;
            padding: 25px;
            background: #1e1e2e;
            border: 1px solid #45475a;
            border-radius: 12px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #45475a;
            background: #11111b;
            color: #cdd6f4;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background: #00ff88;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8cffc8;
        }

        .back {
            background: transparent;
            border: 1px solid #45475a;
            color: #cdd6f4;
        }

        #feedback {
            margin-top: 18px;
            line-height: 1.6;
        }

        .hint {
            color: #a6adc8;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header>
        <h1>🔑 Password Shield</h1>
        <button class="back"
                onclick="window.location.href='index.html'">
            ⬅ Back to Menu
        </button>
    </header>

    <main class="panel">
        <h2>🛡️ Mission 1: Password Defender</h2>

        <p>
            Your mission is to create a strong password.
            Learn how length and variety help protect your accounts.
        </p>

        <label for="password">Test your password:</label>
        <input
            type="password"
            id="password"
            placeholder="Enter a sample password"
            autocomplete="off"
        >

        <button id="check-password">Check Strength</button>

        <p id="feedback" aria-live="polite">
            Your results will appear here.
        </p>

        <p class="hint">
            Training tip: use a long, unique password or passphrase.
            Never enter a real account password into this demo.
        </p>
    </main>

    <script>
        const passwordInput = document.querySelector("#password");
        const feedback = document.querySelector("#feedback");

        document.querySelector("#check-password")
            .addEventListener("click", function() {
                const password = passwordInput.value;
                let score = 0;
                const tips = [];

                if (password.length >= 12) {
                    score++;
                } else {
                    tips.push("Use at least 12 characters.");
                }

                if (/[a-z]/.test(password) &&
                    /[A-Z]/.test(password)) {
                    score++;
                } else {
                    tips.push("Consider using uppercase and lowercase letters.");
                }

                if (/[0-9]/.test(password)) {
                    score++;
                } else {
                    tips.push("Consider including numbers.");
                }

                if (/[^A-Za-z0-9]/.test(password)) {
                    score++;
                } else {
                    tips.push("Consider including symbols.");
                }

                if (password.length === 0) {
                    feedback.textContent =
                        "Enter a sample password to begin your mission.";
                    return;
                }

                const levels = [
                    "Weak",
                    "Needs improvement",
                    "Moderate",
                    "Strong",
                    "Very strong"
                ];

                let result = "Strength estimate: " + levels[score] + ".";

                if (tips.length > 0) {
                    result += "\n\nTips: " + tips.join(" ");
                } else {
                    result +=
                        "\n\nExcellent! You met all four training criteria.";
                }

                feedback.textContent = result;
            });
    </script>
</body>
</html>
