<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Shield | Cyber Defenders</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #11111b;
            --panel: #1e1e2e;
            --surface: #181825;
            --border: #45475a;
            --text: #cdd6f4;
            --muted: #a6adc8;
            --green: #00ff88;
            --blue: #89b4fa;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--page);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 24px;
            border-bottom: 2px solid var(--green);
        }

        h1, h2, h3 { color: var(--green); }
        h1 { margin: 0; font-size: 1.5rem; }

        #player-info {
            color: var(--green);
            font-size: 15px;
            font-weight: bold;
        }

        button, input { font: inherit; }

        button {
            padding: 10px 15px;
            border: 0;
            border-radius: 7px;
            background: var(--green);
            color: var(--page);
            font-weight: bold;
            cursor: pointer;
        }

        button:hover:not(:disabled) { background: #8cffc8; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

        .back-button {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }

        main {
            width: min(1050px, calc(100% - 32px));
            margin: 28px auto;
        }

        .intro, .mission-panel {
            padding: 22px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
        }

        .intro p, .mission-panel p { line-height: 1.6; }
        .muted, .hint { color: var(--muted); }

        #levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .level-card {
            min-height: 142px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            color: var(--text);
            text-align: left;
        }

        .level-card.unlocked { border-color: var(--green); }
        .level-card.locked { cursor: not-allowed; opacity: .48; }
        .level-card .level-number { display: block; margin-bottom: 10px; color: var(--green); }
        .level-card .level-title { display: block; margin-bottom: 8px; font-size: 1rem; }
        .level-card .level-state { color: var(--muted); font-size: .85rem; }

        #mission-view { display: none; }
        #mission-view label { display: block; margin: 18px 0 7px; }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--page);
            color: var(--text);
        }

        #feedback {
            min-height: 28px;
            margin: 14px 0;
            line-height: 1.5;
        }

        .mission-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }

        @media (max-width: 560px) {
            header { padding: 14px 16px; }
            main { width: min(100% - 24px, 1050px); margin: 18px auto; }
            .intro, .mission-panel { padding: 17px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🔑 Password Shield</h1>
        <div id="player-info"><span id="display-name">Jucător: Anonim</span></div>
        <button class="back-button" id="back-home">⬅ Meniul principal</button>
    </header>

    <main>
        <section class="intro" id="map-view">
            <h2>Harta misiunilor</h2>
            <p>Învață să creezi parole puternice, apoi investighează și recuperează conturi într-un laborator fictiv.</p>
            <p class="hint">Folosește doar parole de test. Nu introduce parola reală a unui cont.</p>
            <div id="levels-grid" aria-label="Niveluri Password Shield"></div>
        </section>

        <section class="mission-panel" id="mission-view" aria-live="polite">
            <button type="button" class="back-button" id="back-map">⬅ Înapoi la hartă</button>
            <h2 id="mission-title"></h2>
            <p id="mission-description"></p>
            <div id="mission-content"></div>
            <p id="feedback" role="status"></p>
            <div class="mission-actions">
                <button type="button" id="complete-mission">Verifică misiunea</button>
                <button type="button" class="back-button" id="continue-mission" hidden>Continuă</button>
            </div>
        </section>
    </main>

    <script src="player.js"></script>
    <script>
        const levels = [
            { title: "Password Defender", description: "Creează o parolă de test mai lungă, cu cel puțin 12 caractere." },
            { title: "Adaugă varietate", description: "Fortifică parola folosind litere mici și mari, cifre și simboluri." },
            { title: "O frază unică", description: "Exersează o frază de acces lungă, formată din cel puțin trei cuvinte." },
            { title: "Ordonează jurnalul", description: "Deschide laboratorul SQL și sortează evenimentele de autentificare după timp." },
            { title: "Găsește contul compromis", description: "Identifică înregistrarea care arată schimbarea suspectă a parolei." },
            { title: "Află ce date au fost accesate", description: "Caută în jurnalul de acces datele exportate în incidentul simulat." },
            { title: "Urmărește indiciul", description: "Consultă nota fictivă despre incident și adresa IP observată." },
            { title: "Recuperează contul", description: "Blochează adresa suspectă în simulare și setează o parolă nouă de test." }
        ];

        const mapView = document.querySelector("#map-view");
        const missionView = document.querySelector("#mission-view");
        const levelsGrid = document.querySelector("#levels-grid");
        const feedback = document.querySelector("#feedback");
        const continueButton = document.querySelector("#continue-mission");
        const unlockedKey = "passwordShieldUnlockedLevel";
        const completeKey = "passwordShieldLevelCompleted";
        let currentLevel = 0;

        function getUnlockedLevel() {
            const value = Number(sessionStorage.getItem(unlockedKey) || 1);
            return Number.isInteger(value) ? Math.min(8, Math.max(1, value)) : 1;
        }

        function renderMap() {
            levelsGrid.replaceChildren();
            const unlockedLevel = getUnlockedLevel();

            levels.forEach((level, index) => {
                const levelNumber = index + 1;
                const button = document.createElement("button");
                const isUnlocked = levelNumber <= unlockedLevel;
                const isComplete = sessionStorage.getItem(completeKey + levelNumber) === "true";
                button.type = "button";
                button.className = "level-card " + (isUnlocked ? "unlocked" : "locked");
                button.disabled = !isUnlocked;
                button.innerHTML =
                    `<span class="level-number">Nivel ${levelNumber}</span>` +
                    `<span class="level-title">${level.title}</span>` +
                    `<span class="level-state">${isComplete ? "✓ Finalizat" : isUnlocked ? "Disponibil" : "🔒 Blocat"}</span>`;
                if (isUnlocked) button.addEventListener("click", () => openLevel(levelNumber));
                levelsGrid.appendChild(button);
            });
        }

        function openLevel(levelNumber) {
            if (levelNumber > getUnlockedLevel()) return;
            currentLevel = levelNumber;
            if (levelNumber >= 4) {
                window.location.href = `password-investigation.html?level=${levelNumber}`;
                return;
            }

            mapView.style.display = "none";
            missionView.style.display = "block";
            document.querySelector("#mission-title").textContent = `Nivel ${levelNumber}: ${levels[levelNumber - 1].title}`;
            document.querySelector("#mission-description").textContent = levels[levelNumber - 1].description;
            document.querySelector("#mission-content").replaceChildren();
            const label = document.createElement("label");
            const input = document.createElement("input");
            label.htmlFor = "sample-password";
            label.textContent = "Parolă de test:";
            input.id = "sample-password";
            input.type = "password";
            input.autocomplete = "new-password";
            input.placeholder = "Nu folosi o parolă reală";
            document.querySelector("#mission-content").append(label, input);
            feedback.textContent = "";
            continueButton.hidden = true;
            document.querySelector("#complete-mission").hidden = false;
        }

        function checkPasswordMission() {
            const password = document.querySelector("#sample-password").value;
            const words = password.trim().split(/\s+/).filter(Boolean);
            let success = false;

            if (currentLevel === 1) {
                success = password.length >= 12;
                feedback.textContent = success
                    ? "Bun început! O parolă mai lungă este mai greu de ghicit."
                    : "Mai încearcă: ai nevoie de cel puțin 12 caractere.";
            } else if (currentLevel === 2) {
                success = password.length >= 14 &&
                    /[a-z]/.test(password) && /[A-Z]/.test(password) &&
                    /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password);
                feedback.textContent = success
                    ? "Parola de test îndeplinește toate cele patru criterii."
                    : "Folosește cel puțin 14 caractere, litere mici și mari, cifre și un simbol.";
            } else {
                success = password.length >= 16 && words.length >= 3;
                feedback.textContent = success
                    ? "Fraza de test este suficient de lungă și conține cel puțin trei cuvinte."
                    : "Încearcă o frază de cel puțin 16 caractere și trei cuvinte separate prin spații.";
            }

            if (success) completeCurrentLevel();
        }

        function completeCurrentLevel() {
            sessionStorage.setItem(completeKey + currentLevel, "true");
            if (currentLevel < 8) {
                sessionStorage.setItem(unlockedKey, String(Math.max(getUnlockedLevel(), currentLevel + 1)));
                continueButton.textContent = currentLevel === 3 ? "Continuă spre laboratorul SQL" : "Următorul nivel";
                continueButton.hidden = false;
            } else {
                feedback.textContent = "Contul demonstrativ a fost recuperat. Misiunea este completă!";
            }
            document.querySelector("#complete-mission").hidden = true;
        }

        document.querySelector("#back-home").addEventListener("click", () => {
            window.location.href = "index.html";
        });
        document.querySelector("#back-map").addEventListener("click", () => {
            missionView.style.display = "none";
            mapView.style.display = "block";
            renderMap();
        });
        document.querySelector("#complete-mission").addEventListener("click", checkPasswordMission);
        continueButton.addEventListener("click", () => {
            if (currentLevel === 3) {
                window.location.href = "password-investigation.html?level=4";
            } else {
                missionView.style.display = "none";
                mapView.style.display = "block";
                renderMap();
            }
        });

        renderMap();
    </script>
</body>
</html>
